# Auto-provisioned data sources for Grafana (Sprint 7 + Sprint 8).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  # Sprint 8: Tempo backs traces. The `tracesToMetrics` correlation
  # works once trace exemplars are wired (D-44 follow-up); for now
  # Grafana just queries Tempo directly for trace IDs.
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    editable: false
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
