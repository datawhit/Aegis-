# OpenTelemetry Collector — local dev config (Sprint 7, extended Sprint 8).
#
# Pipeline:
#   FastAPI / Celery / SQLAlchemy / httpx → OTLP gRPC :4317 → collector
#   → metrics: Prometheus exporter :8889 (scraped by Prometheus)
#   → traces:  OTLP gRPC → tempo:4317 (queryable from Grafana)
#
# Sprint 8 (D-42): traces now flow to Tempo instead of the stdout debug
# exporter. The debug exporter is kept on a separate pipeline so a
# `docker logs aegis-otel-collector` still surfaces something if Tempo is
# down — useful when debugging the collector itself.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  # Drop request paths that bury the dashboards in noise.
  filter/healthchecks:
    metrics:
      datapoint:
        - 'IsMatch(attributes["http.target"], "/api/v1/(health|ready)")'

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Resource attrs (service.name etc.) become Prometheus labels.
    resource_to_telemetry_conversion:
      enabled: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [filter/healthchecks, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
