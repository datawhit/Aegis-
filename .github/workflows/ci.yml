name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_ci
          POSTGRES_DB: aegis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AEGIS_ENV: ci
      AEGIS_DATABASE_URL: postgresql+asyncpg://aegis:aegis_ci@localhost:5432/aegis_test
      AEGIS_DATABASE_URL_SYNC: postgresql+psycopg://aegis:aegis_ci@localhost:5432/aegis_test
      AEGIS_REDIS_URL: redis://localhost:6379/0
      AEGIS_CELERY_BROKER_URL: redis://localhost:6379/1
      AEGIS_CELERY_RESULT_BACKEND: redis://localhost:6379/2
      AEGIS_JWT_SECRET: ci-only-secret-not-used-anywhere-real
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Format check (ruff)
        run: ruff format --check app tests
      - name: Type check (mypy)
        run: mypy app
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: pytest -v --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (eslint + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
