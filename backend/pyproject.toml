[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-backend"
version = "0.1.0"
description = "Aegis — Autonomous Security Operations Governance Platform (backend)"
requires-python = ">=3.12"
dependencies = [
    # --- Web ---
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",

    # --- DB ---
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "psycopg[binary]==3.2.3",          # sync driver for Alembic
    "alembic==1.13.3",
    "pgvector==0.3.4",

    # --- Cache / queue ---
    "redis==5.0.8",
    "celery==5.4.0",

    # --- Config / validation ---
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.5.2",

    # --- Auth ---
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    # Pin bcrypt below 4.1 — passlib 1.7.4's bcrypt backend probes for
    # version via `bcrypt.__about__`, which was removed in 4.1+. Without
    # this pin, every hash_password() / verify_password() raises
    # `ValueError: password cannot be longer than 72 bytes` regardless of
    # input length, because passlib's backend init fails silently and the
    # call falls back to raw bcrypt with the wrong argument shape.
    "bcrypt==4.0.1",

    # --- Observability ---
    "structlog==24.4.0",
    # OpenTelemetry (Sprint 7, closes D-3). SDK + four instrumentations
    # (FastAPI, SQLAlchemy, httpx, Celery). All export to OTLP; the
    # otel-collector container picks up + fans out (Prometheus today,
    # Tempo/Jaeger later). Pinned to 1.29 / 0.50b0 — earlier 0.48b0 still
    # imported `pkg_resources`, which setuptools 80+ removed.
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-instrumentation-sqlalchemy==0.50b0",
    "opentelemetry-instrumentation-httpx==0.50b0",
    "opentelemetry-instrumentation-celery==0.50b0",

    # --- AI providers ---
    "anthropic==0.39.0",

    # --- Misc ---
    "httpx==0.27.2",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-passlib==1.7.7.20240819",
    "asgi-lifespan==2.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

# --- Tooling -----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "ASYNC",            # async best practices
    "S",                # security (bandit-equivalent)
]
ignore = [
    "S101",             # asserts in tests
    "B008",             # function-call-in-default — fine for Depends()
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
disallow_untyped_decorators = false
warn_unused_ignores = true
ignore_missing_imports = true
# Pragmatic relaxations — the codebase has historical bare-generic
# annotations (dict / list without parameters) and a few SQLAlchemy
# call sites that legitimately return Any. We keep the rest of strict.
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Pin fixture loop scope to "function" so the db_session fixture, the
# client fixture (which depends on db_session), and the test function
# all share one event loop. Without this, pytest-asyncio 0.24+ may run
# the fixture and the test on different loops — which surfaces as
# "Future attached to a different loop" once an async connection is
# created in setup and awaited inside the test.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
