[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-backend"
version = "0.1.0"
description = "Aegis — Autonomous Security Operations Governance Platform (backend)"
requires-python = ">=3.12"
dependencies = [
    # --- Web ---
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",

    # --- DB ---
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "psycopg[binary]==3.2.3",          # sync driver for Alembic
    "alembic==1.13.3",
    "pgvector==0.3.4",

    # --- Cache / queue ---
    "redis==5.0.8",
    "celery==5.4.0",

    # --- Config / validation ---
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",

    # --- Auth ---
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",

    # --- Observability ---
    "structlog==24.4.0",

    # --- AI providers ---
    "anthropic==0.39.0",

    # --- Misc ---
    "httpx==0.27.2",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-passlib==1.7.7.20240819",
    "asgi-lifespan==2.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

# --- Tooling -----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "ASYNC",            # async best practices
    "S",                # security (bandit-equivalent)
]
ignore = [
    "S101",             # asserts in tests
    "B008",             # function-call-in-default — fine for Depends()
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
disallow_untyped_decorators = false
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
